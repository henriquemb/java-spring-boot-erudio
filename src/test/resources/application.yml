server:
  port: 8888
spring:
  application:
    name: java-spring-boot-erudio
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
logging:
  level:
    root: info
    sql: info
    com.github.henriquemb: info
springdoc:
  paths-to-match: /api/v1/**
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    use-root-path: true
server:
  port: 8888
cors:
  originPatterns: http://localhost:8888
file:
  upload-dir: /Cursos/java-spring-boot-erudio/uploads
spring:
  application:
    name: java-spring-boot-erudio
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: 200MB
      max-request-size: 215MB
logging:
  level:
    root: info
    sql: info
    com.github.henriquemb: info
springdoc:
  paths-to-match: /api/v1/**
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    use-root-path: true